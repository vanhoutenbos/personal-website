{% assign page_url = page.url | absolute_url %}
{% assign site_url = site.url | default: page_url %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ site_url }}#website",
      "url": "{{ site_url }}",
      "name": "{{ site.title }}",
      "description": "{{ site.description | escape }}",
      "inLanguage": "nl"
    },
    {
      "@type": "WebPage",
      "@id": "{{ page_url }}#webpage",
      "url": "{{ page_url }}",
      "name": "{{ page.title | escape }}",
      "isPartOf": { "@id": "{{ site_url }}#website" },
      "datePublished": "{{ page.date | date_to_xmlschema | default: site.time | date_to_xmlschema }}",
      "dateModified": "{{ page.last_modified_at | date_to_xmlschema | default: page.date | date_to_xmlschema }}",
      "description": "{{ page.description | default: site.description | escape }}",
      "inLanguage": "nl",
      {% if page.categories %}"about": [ {% for c in page.categories %}{"@type":"Thing","name":"{{ c }}"}{% unless forloop.last %}, {% endunless %}{% endfor %} ],{% endif %}
      "breadcrumb": {
        "@type": "BreadcrumbList",
        "itemListElement": [
          {"@type": "ListItem","position": 1, "name": "Home", "item": "{{ site_url }}"},
          {% if page.categories and page.categories.size > 0 %}{"@type": "ListItem","position": 2, "name": "{{ page.categories | first }}", "item": "{{ site_url }}/{{ page.categories | first | downcase | replace: ' ', '-' }}"}, {% endif %}
          {"@type": "ListItem","position": {% if page.categories and page.categories.size > 0 %}3{% else %}2{% endif %}, "name": "{{ page.title | escape }}", "item": "{{ page_url }}"}
        ]
      }
    }
    {% if page.collection == 'posts' %},
    {
      "@type": "BlogPosting",
      "@id": "{{ page_url }}#blogpost",
      "url": "{{ page_url }}",
      "headline": "{{ page.title | escape }}",
      "description": "{{ page.description | default: site.description | escape }}",
      "datePublished": "{{ page.date | date_to_xmlschema }}",
      "dateModified": "{{ page.last_modified_at | date_to_xmlschema | default: page.date | date_to_xmlschema }}",
      "author": {
        "@type": "Person",
        "name": "{{ site.author.name }}",
        "url": "{{ site.url }}"
      },
      "publisher": {
        "@type": "Organization",
        "name": "{{ site.author.name }}",
        "logo": {
          "@type": "ImageObject",
          "url": "{{ site.logo | default: site.url | append: '/assets/img/logo.png' }}"
        }
      },
      {% if page.tags %}"keywords": "{{ page.tags | join: ', ' }}",{% endif %}
      "mainEntityOfPage": {"@id": "{{ page_url }}#webpage"}
    }
    {% endif %}
  ]
}
</script>
